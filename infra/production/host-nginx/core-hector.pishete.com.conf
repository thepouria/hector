# Hector API — host Nginx site (HTTP bootstrap)
# Install later to: /etc/nginx/sites-available/core-hector.pishete.com
# Enable with: ln -s ... /etc/nginx/sites-enabled/  (NOT during P.2.1)
#
# Upstream: Hector API container bound to 127.0.0.1:3101 (shared-host profile)
# Additive only — never overwrite existing sites or certificates.

upstream hector_api_upstream {
  server 127.0.0.1:3101;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name core-hector.pishete.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    allow all;
  }

  client_max_body_size 25m;

  location / {
    proxy_pass http://hector_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}

# After certificates exist, enable core-hector.pishete.com.https.conf.template.
