# Hector production Compose — single-server layout.
#
# Usage (repository root):
#   export HECTOR_IMAGE_TAG=<git-sha>
#   docker compose -f infra/production/compose.yaml --env-file <secure-env> config
#   ./infra/production/scripts/deploy.sh
#
# Public ports: Nginx only (80/443). API, Web, and PostgreSQL stay internal.
# Never run demo seed from this Compose file.
# Never use `docker compose down -v` on production volumes.
# Never run `prisma migrate reset` against production.

name: hector-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hector}
      POSTGRES_USER: ${POSTGRES_USER:-hector_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${TZ:-UTC}
      LANG: en_US.UTF-8
    volumes:
      - hector_prod_postgres_data:/var/lib/postgresql/data
    networks:
      - internal_application_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    # No ports: — PostgreSQL must stay private
    logging: *default-logging
    mem_limit: 1g

  migrate:
    image: ${HECTOR_MIGRATE_IMAGE:-hector-api-migrate:latest}
    pull_policy: never
    profiles: ['migrate']
    restart: 'no'
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL_MIGRATE:?DATABASE_URL_MIGRATE is required}
      TZ: ${TZ:-UTC}
    networks:
      - internal_application_network
    depends_on:
      postgres:
        condition: service_healthy
    # One-off: prisma migrate deploy only (no seed, no reset)
    logging: *default-logging

  api:
    image: ${HECTOR_API_IMAGE:-hector-api:latest}
    pull_policy: never
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: ${TZ:-UTC}
      API_PORT: ${API_PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://hector.pishete.com}
      SWAGGER_ENABLED: 'false'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      AUTH_REFRESH_PEPPER: ${AUTH_REFRESH_PEPPER:?AUTH_REFRESH_PEPPER is required}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      AUTH_SESSION_TTL_DAYS: ${AUTH_SESSION_TTL_DAYS:-30}
      AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-hector_refresh}
    networks:
      - internal_application_network
    depends_on:
      postgres:
        condition: service_healthy
    # No ports: — only reachable via Nginx on internal network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.API_PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    logging: *default-logging
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  web:
    image: ${HECTOR_WEB_IMAGE:-hector-web:latest}
    pull_policy: never
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: ${TZ:-UTC}
      PORT: ${WEB_PORT:-3000}
      HOSTNAME: 0.0.0.0
    networks:
      - internal_application_network
      - public_proxy_network
    depends_on:
      api:
        condition: service_healthy
    # No ports: — only reachable via Nginx
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    logging: *default-logging
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
      - '${NGINX_HTTPS_PORT:-443}:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - hector_prod_certbot_www:/var/www/certbot:ro
      - hector_prod_certs:/etc/nginx/certs:ro
    networks:
      - public_proxy_network
      - internal_application_network
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    logging: *default-logging
    mem_limit: 256m

networks:
  public_proxy_network:
    name: hector_public_proxy
    driver: bridge
  internal_application_network:
    name: hector_internal_app
    driver: bridge
    # No external connectivity; Postgres/API stay off the public path.
    internal: true

volumes:
  hector_prod_postgres_data:
    name: hector_prod_postgres_data
  hector_prod_certs:
    name: hector_prod_certs
  hector_prod_certbot_www:
    name: hector_prod_certbot_www
