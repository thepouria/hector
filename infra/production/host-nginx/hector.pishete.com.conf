# Hector frontend — host Nginx site (HTTP bootstrap)
# Install later to: /etc/nginx/sites-available/hector.pishete.com
# Enable with: ln -s ... /etc/nginx/sites-enabled/  (NOT during P.2.1)
#
# Upstream: Hector Web container bound to 127.0.0.1:3100 (shared-host profile)
# Do NOT replace nginx.conf. Do NOT modify bazarbashe / office.fanoma.ir sites.
# Do NOT set default_server. Do NOT use wildcard server_name.

upstream hector_web_upstream {
  server 127.0.0.1:3100;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name hector.pishete.com;

  # ACME HTTP-01 (certbot webroot — path must match host certbot setup)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    allow all;
  }

  client_max_body_size 25m;

  location / {
    proxy_pass http://hector_web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}

# After certificates exist, enable hector.pishete.com.https.conf.template
# and add HTTP→HTTPS redirect. Do not enable HSTS until HTTPS is verified.
