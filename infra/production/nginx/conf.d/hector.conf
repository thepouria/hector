# Hector production vhosts (HTTP bootstrap + ACME)
# Domains: hector.pishete.com (Web) · core-hector.pishete.com (API)
#
# Default mode is HTTP-only so Nginx can start before certificates exist.
# After Let's Encrypt provisioning, enable hector.https.conf.template
# (see docs/production-deployment.md) and redirect HTTP→HTTPS.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# ---------------------------------------------------------------------------
# Frontend — hector.pishete.com
# ---------------------------------------------------------------------------
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name hector.pishete.com;

  # Container / load-balancer probe (Host may be 127.0.0.1)
  location = /nginx-health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # ACME HTTP-01 challenge (Let's Encrypt bootstrap)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    allow all;
  }

  location /health {
    proxy_pass http://hector_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
  }

  location / {
    proxy_pass http://hector_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
  }
}

# ---------------------------------------------------------------------------
# Backend — core-hector.pishete.com
# ---------------------------------------------------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name core-hector.pishete.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    allow all;
  }

  location /health {
    proxy_pass http://hector_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
  }

  location / {
    proxy_pass http://hector_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 25m;
  }
}

# Optional HTTPS: copy hector.https.conf.template → hector.https.conf after certs exist.
# Do not add listen 443 here until certificate files are mounted.
